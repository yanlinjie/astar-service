# 启动：docker compose up -d        停止：docker compose down
# 换地图：改下面的 NAV_MAP 后 docker compose up -d（可用地图：docker run --rm robot-nav-astar maps）
services:
  nav-astar:
    image: robot-nav-astar:latest
    container_name: nav-astar
    restart: unless-stopped
    environment:
      NAV_MAP: room1110/2026-11-11.2
    ports:
      - "127.0.0.1:8765:8765"   # HTTP
      - "127.0.0.1:8766:8766"   # WebSocket
